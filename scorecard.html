<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#0b1020"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="stylesheet" href="css/theme-dark.css"/>
  <title>MPGB Premier League - Scorecard</title>
</head>
<body data-page="scorecard">
  <div class="topbar">
    <a id="navLeft" href="#" aria-label="Back"></a>
    <div class="brand">
      <img class="logo" src="assets/icons/shield.svg" alt="logo"/>
      <div class="title" id="brandTitle">MPGB PREMIER LEAGUE</div>
    </div>
    <div id="navRight"></div>
  </div>

  <div class="container">
    
  <div class="card">
    <div class="matchHeader">
      <div class="h1" id="scTitle">FULL SCORECARD</div>
      <div class="sep"></div>
      <div class="h2" id="innTitle">Innings</div>
    </div>
    <div class="cardPad">
      <div id="batTable"></div>
      <div class="sep"></div>
      <div id="extras"></div>
      <div class="sep"></div>
      <div id="total"></div>
      <div class="sep"></div>
      <div id="bowlTable"></div>
    </div>
  </div>

  </div>

  <div class="footerTabs">
    <div class="tabs" id="tabs"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>

name: Build Android APK
on:
  push:
    branches: [ main, chatgpt/cricpro-score-v1 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Prepare offline web assets
        run: |
          mkdir -p app/src/main/assets/www
          cp -r index.html scorecard.html points.html stats.html settings.html manifest.json sw.js css js assets app/src/main/assets/www/ 2>/dev/null || true
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CricPro-Score-Android
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
